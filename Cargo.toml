[package]
name = "feather-experiments"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = { version = "1.2.0", features = ["avoid-default-panic"] }
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
